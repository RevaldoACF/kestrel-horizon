name: Build Kestrel Horizon Client

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK / glslc shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc || sudo apt-get install -y glslang-tools

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - name: Build release binaries (libkestrel.so + kestrel-inject)
        run: cargo build --release --workspace

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-horizon-linux-x86_64
          path: |
            target/release/libkestrel.so
            target/release/kestrel-inject
